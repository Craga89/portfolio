# Temporary: regenerates the lockfile for PR #61 with @emnapi/runtime pinned at 1.11.3 (rolldown's
# 2.0 beta crashes astro check's WebAssembly parser), then pushes the result to
# deps/emnapi-lock-out. Delete both branches after.
name: emnapi lockfile
on:
  push:
    branches: ['deps/emnapi-lock']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: Craga89/standards/github/actions/setup-node@853466a9240bc03d592fa6a406378379f7c6dc7e # v1.1.0
      - uses: Craga89/standards/github/actions/setup-playwright@853466a9240bc03d592fa6a406378379f7c6dc7e # v1.1.0
      - run: |
          pnpm add -D --save-exact @emnapi/runtime@1.11.3
          grep -n "astrojs/check@0.9.12" pnpm-lock.yaml | head -3
          pnpm exec astro check
          pnpm run build
          pnpm run typecheck
      - run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b deps/emnapi-lock-out
          git add package.json pnpm-lock.yaml
          git commit -m "lockfile"
          git push -f origin deps/emnapi-lock-out
