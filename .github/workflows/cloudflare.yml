# Cloudflare Previews of every branch: the site on the portfolio Worker (cloudflare/wrangler.jsonc),
# each branch at an address of its own, through Craga89/standards' shared Preview workflow. main
# isn't previewed: ci.yml's deploy job deploys it to the Worker, which serves craigthompson.dev,
# once it has passed every check. See Craga89/standards guidelines/hosting.md.
#
# Previews get PREVIEW_BRANCH, so they show the preview bar, count no visits and stay noindex;
# ask.sh's Worker allows their addresses. Previews are behind Cloudflare Access: CI's check signs
# in with a service token. Not a required check.
name: Preview

on:
  push:
    branches-ignore:
      - main # deployed by ci.yml once every check passes
      # Branches that hold reports and data, not changes to the site.
      - accessibility
      - blog-import
      - bootstrap/**
      - dependabot/** # Dependabot's runs get no secrets
      - evals
      - indexnow
      - lighthouse
      - node-modules
      - oss
      - redirect-data
      - visual-baselines
  pull_request:
    types: [opened, reopened] # comments the link on a branch pushed before its pull request
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per branch, so a newer push (or deleting the branch) replaces a run that hasn't finished. Pull
  # request events only comment, so they get a group of their own and never cancel a build.
  group: preview-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ github.event_name == 'delete' && github.event.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  preview:
    # Deleting a tag has no Preview to remove; Dependabot's, bootstrap and forks' pull requests get
    # none.
    if: >-
      (github.event_name != 'delete' || github.event.ref_type == 'branch') &&
      (github.event_name != 'pull_request' ||
        (!startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'bootstrap/') &&
         github.event.pull_request.head.repo.full_name == github.repository))
    uses: Craga89/standards/.github/workflows/cloudflare-preview.yml@118ae2dac67218985916f2f95e069ec5e9394c7b # v1
    permissions:
      contents: read
      statuses: write # the "Preview" status on the commit
      pull-requests: write # the comment with the link
    with:
      worker: portfolio # the "name" in cloudflare/wrangler.jsonc
      workers-subdomain: craga89
      config: cloudflare/wrangler.jsonc
      headers: cloudflare/_headers
      playwright: true
      # The open-source counts come from the oss branch, as in build.yml.
      build-command: git fetch -q --depth=1 origin oss:refs/remotes/origin/oss || true; pnpm run build
      check-command: tools/cloudflare-check.sh "$PREVIEW_URL" preview
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      access-client-id: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      access-client-secret: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
