# Screenshot comparison of the built site against reference images kept on the
# `visual-baselines` branch. A commit with "[visual]" in its message accepts the new look;
# the first run creates the baselines.
name: Screenshot comparison

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/visual.mjs', '.github/workflows/visual.yml']
  workflow_dispatch:
    inputs:
      update:
        description: Accept the current look as the new baseline
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: visual
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: |
          npm i --no-save playwright@1 pixelmatch@6 pngjs@7
          npx playwright install --with-deps chromium
      - name: Fetch baselines
        id: base
        run: |
          if git fetch -q origin visual-baselines 2>/dev/null; then
            mkdir -p baselines && git archive origin/visual-baselines | tar -x -C baselines
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decide
        id: mode
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ steps.base.outputs.have }}" != "true" ] || [ "${{ inputs.update }}" = "true" ] || echo "$MSG" | grep -q '\[visual\]'; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare
        if: steps.mode.outputs.update != 'true'
        run: node tools/visual.mjs --out shots --baseline baselines --diff diffs
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            diffs
            shots
      - name: Update baselines
        if: steps.mode.outputs.update == 'true'
        run: |
          node tools/visual.mjs --out shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan vb-tmp
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name shots ! -name .git -exec rm -rf {} +
          mv shots/*.png . && rmdir shots
          git add *.png
          git commit -qm "Screenshot baselines for ${{ github.sha }}"
          git push -f origin vb-tmp:visual-baselines
          { echo "## Screenshot baselines updated"; echo; ls *.png | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
