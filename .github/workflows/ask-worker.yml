# Deploys the ask.sh Worker (worker/) to Cloudflare whenever it or its knowledge file changes.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy ask.sh worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/ask-worker.yml']
  workflow_dispatch:

concurrency:
  group: ask-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test
        run: node worker/test/worker.test.mjs
      - name: Skip (no Cloudflare secrets yet)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the ask.sh worker."
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
      - name: Smoke test
        if: env.HAS_TOKEN == 'true'
        run: |
          sleep 5
          fail=0
          for q in "Has he been through an acquisition?" "Where did he study?"; do
            code=$(curl -sS -m 60 -o out.json -w '%{http_code}' -X POST "$ASK_URL" -H 'origin: https://craga.dev' -H 'content-type: application/json' \
              --data "$(jq -n --arg q "$q" '{q: $q}')" || echo 000)
            if [ "$code" = 200 ] && jq -e '.answer | length > 0' out.json >/dev/null; then
              echo "::notice title=$q::$(jq -r '"\(.answer | gsub("\n"; " ")) [sources: \(.sources | join(", "))] [\(.model)]"' out.json)"
            else
              echo "::error title=$q::HTTP $code $(head -c 300 out.json 2>/dev/null)"; fail=1
            fi
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$ASK_URL" -H 'origin: https://example.com' -H 'content-type: application/json' --data '{"q":"hi"}')
          if [ "$code" = 403 ]; then echo "::notice title=Other origins::refused (403)"; else echo "::error title=Other origins::expected 403, got $code"; fail=1; fi
          exit $fail
        env:
          ASK_URL: https://craga-ask.craga89.workers.dev/ask
