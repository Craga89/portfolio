# Deploys the ask.sh Worker (worker/) to Cloudflare whenever it or its knowledge file changes.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy ask.sh worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/ask-worker.yml']
  workflow_dispatch:

concurrency:
  group: ask-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node worker/test/worker.test.mjs
      - name: Skip (no Cloudflare secrets yet)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the ask.sh worker."
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
      - name: Smoke test
        if: env.HAS_TOKEN == 'true'
        run: |
          sleep 5
          for q in "Has he been through an acquisition?" "Where did he study?"; do
            echo "Q: $q"
            curl -sS -m 60 -X POST "$ASK_URL" -H 'origin: https://craga.dev' -H 'content-type: application/json' \
              --data "$(jq -n --arg q "$q" '{q: $q}')" -w '\nHTTP %{http_code} in %{time_total}s\n'
            echo
          done
          echo "Other origins are refused:"
          curl -sS -o /dev/null -w 'HTTP %{http_code}\n' -X POST "$ASK_URL" -H 'origin: https://example.com' -H 'content-type: application/json' --data '{"q":"hi"}'
        env:
          ASK_URL: https://craga-ask.craga89.workers.dev/ask
