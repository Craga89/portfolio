# Security review of every pull request by Claude. Make "security / Security review" a required
# check, so a finding blocks the merge until it's fixed or accepted (the security-accepted label).
# Signs in with workload identity federation, its IDs in repository variables. Dependabot bumps
# the pin. See Craga89/standards guidelines/code-review.md.
name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    # Other labels don't re-run it. Filtered here, not in the called workflow, so a skipped run
    # can't replace a failed "security / Security review" check with a passing one.
    if: github.event.action != 'labeled' || github.event.label.name == 'security-accepted'
    uses: Craga89/standards/.github/workflows/security-review.yml@cccdbeeba06544c6ef13a0edd1551a4e3319f473 # v1
    permissions:
      contents: read
      pull-requests: write # the review comments with the findings
      id-token: write # signs in to the Claude API with workload identity federation
    with:
      federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
