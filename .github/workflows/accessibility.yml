# The WCAG 2.2 AA suite (tests/a11y/) against the live site: weekly and on demand. CI runs the
# same suite on every build before it's deployed. The report goes to the accessibility branch,
# and the run fails if anything doesn't pass.
name: Accessibility (WCAG 2.2 AA, live site)

on:
  workflow_dispatch:
    inputs:
      url:
        description: The address to test
        default: https://craigthompson.dev/
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC

permissions:
  contents: write

concurrency:
  group: accessibility
  cancel-in-progress: true

jobs:
  wcag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ inputs.url || 'https://craigthompson.dev/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: Craga89/standards/github/actions/setup-playwright@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - name: Run the suite
        id: run
        continue-on-error: true
        run: pnpm exec playwright test --project=a11y-desktop --project=a11y-mobile --workers=4
      - name: Save to the accessibility branch
        if: always() && hashFiles('a11y.json') != ''
        run: |
          mkdir -p out/reports && cp a11y.json out/reports/latest.json
      - if: always() && hashFiles('a11y.json') != ''
        uses: Craga89/standards/github/actions/report-meta@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          dir: out/reports
      - if: always() && hashFiles('a11y.json') != ''
        uses: Craga89/standards/github/actions/publish-branch@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          branch: accessibility
          source: out
          message: WCAG 2.2 AA report for ${{ env.BASE_URL }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: |
            a11y.json
            playwright-report
          retention-days: 14
      - name: Fail if anything didn't pass
        if: steps.run.outcome != 'success'
        run: exit 1
