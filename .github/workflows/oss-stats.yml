# Weekly: counts merged upstream pull requests and qTip2's stars, forks and commits,
# and saves them to the `oss` branch (reports/oss.json). The Pages deploy publishes them in live.json.
name: Open-source stats

on:
  schedule:
    - cron: '11 5 * * 1' # Mondays, 05:11 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Count
        run: node tools/oss-stats.mjs oss.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p out/reports && cp oss.json out/reports/oss.json
      - uses: Craga89/standards/publish-branch@2683e4116e18f128c46fce9261c4bd5d1284e8ff # v1
        with:
          branch: oss
          source: out
          message: Open-source stats ${{ github.run_started_at }}
