# Weekly: counts merged upstream pull requests and qTip2's stars, forks and commits,
# and saves them to the `oss` branch (reports/oss.json). The Pages deploy publishes them in live.json.
name: Open-source stats

on:
  schedule:
    - cron: '11 5 * * 1' # Mondays, 05:11 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: Count
        run: node tools/oss-stats.mjs oss.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p out/reports && cp oss.json out/reports/oss.json
      - uses: ./.github/actions/publish-branch
        with:
          branch: oss
          source: out
          message: Open-source stats ${{ github.run_started_at }}
