# A preview of every branch at craigthompson.dev/preview/<branch>-<hash>/, rebuilt on each push.
# It doesn't wait for the tests: it builds the branch under that path and stores it on the pages
# branch, and preview-deploy.yml publishes it. The commit gets a "Preview" status linking to it,
# and the branch's pull request one comment. Deleting the branch removes its preview. Previews stay
# out of search engines and don't count visits. See Craga89/standards guidelines/previews.md.
name: Preview

on:
  push:
    branches-ignore:
      - main
      - pages # what Pages serves (written by the workflows)
      # Branches that hold reports and data, not changes to the site.
      - accessibility
      - blog-import
      - bootstrap/**
      - dependabot/**
      - evals
      - indexnow
      - lighthouse
      - node-modules
      - oss
      - redirect-data
      - site-store
      - visual-baselines
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    # Deleting a report branch has no preview to remove.
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    uses: Craga89/standards/.github/workflows/preview.yml@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
    permissions:
      contents: write # the pages branch
      pages: read # where Pages serves the site
      statuses: write # the "Preview" status on the commit
      pull-requests: write # the comment with the link
    with:
      # The open-source counts come from the oss branch, as in build.yml.
      build-command: git fetch -q --depth=1 origin oss:refs/remotes/origin/oss || true; pnpm run build
      base-env: PREVIEW_BASE
      playwright: true
