# ask.sh answer tests (worker/evals.json): after CI deploys a worker change that could change answers, weekly and on demand.
# Results go to the `evals` branch (reports/latest.json); the Pages deploy publishes them in
# live.json, and the site shows them under "how ask.sh is tested". Fails if any answer is wrong.
name: ask.sh answer tests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '23 5 * * 1' # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evals
  cancel-in-progress: true

jobs:
  evals:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # After a deploy, only when something that changes answers changed: the worker's code, its
      # prompt and models, the shared search or the test cases. Content-only deploys (every site
      # build) skip it, since the tests share the day's free AI allowance with visitors.
      - name: Decide whether to run
        id: need
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=2 origin "$SHA"
          if git diff --name-only "$SHA~1" "$SHA" | grep -qE '^(worker/src/|worker/evals\.json|shared/|tools/ask-evals\.mjs)'; then echo "run=1" >> "$GITHUB_OUTPUT"
          else echo "::notice title=ask.sh answer tests::Skipped: this deploy changed content only. They run weekly and on demand."; echo "run=0" >> "$GITHUB_OUTPUT"; fi
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Run the answer tests
        if: steps.need.outputs.run == '1'
        id: run
        continue-on-error: true
        run: |
          sleep 60 # a fresh deploy's smoke test shares the per-visitor rate limit
          node tools/ask-evals.mjs https://craga-ask.craga89.workers.dev/ask --out evals.json
      - name: Prepare the report
        if: always() && steps.need.outputs.run == '1'
        id: report
        run: |
          [ -f evals.json ] || exit 0
          node -e '
            const fs = require("fs"), r = JSON.parse(fs.readFileSync("evals.json", "utf8"));
            r.run = process.env.RUN_URL; r.sha = process.env.SHA;
            fs.mkdirSync("out/reports", { recursive: true });
            fs.writeFileSync("out/reports/latest.json", JSON.stringify(r, null, 2));'
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: always() && steps.report.outputs.ready == 'true'
        uses: Craga89/standards/publish-branch@0c41b52a17c2687d2fe3c3b95f838b653a4e4e1b # v1
        with:
          branch: evals
          source: out
          message: ask.sh answer tests for ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Fail if any answer was wrong
        if: steps.need.outputs.run == '1' && steps.run.outcome != 'success'
        run: exit 1
