# Old-domain redirects (redirects/old-domains.json, tools/redirects.mjs).
#   discover: list every URL the Wayback Machine has archived on the old domains, and where
#             each will go; saved to the redirect-data branch (archived.md is the readable one).
#   targets:  before switching over, check every destination loads (saved as archive/targets.md).
#   check:    request the test URLs and every archived URL, and check each redirects once,
#             permanently, to the right place, and that the destination loads.
name: Old-domain redirects

on:
  workflow_dispatch:
    inputs:
      task:
        description: discover or check
        type: choice
        options: [discover, targets, check]
        default: check

permissions:
  contents: write

concurrency:
  group: redirects
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Discover archived URLs
        if: inputs.task == 'discover'
        run: |
          node tools/redirects.mjs discover out
          head -c 3000 out/archived.md
          mkdir -p data/archive && cp out/archived.json out/archived.md data/archive/
      - if: inputs.task == 'discover'
        uses: Craga89/standards/github/actions/publish-branch@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          branch: redirect-data
          source: data
          message: Archived URLs on the old domains
      - name: Check the destinations load
        if: inputs.task == 'targets'
        run: |
          git fetch -q --depth=1 origin redirect-data:refs/remotes/origin/redirect-data
          git show origin/redirect-data:archive/archived.json > archived.json
          node tools/redirects.mjs targets archived.json targets.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c rd origin/redirect-data
          mkdir -p archive && mv targets.md archive/targets.md
          git add archive/targets.md && git commit -qm "Redirect destinations, $(date -u +%F)" && git push -q origin HEAD:redirect-data
      - name: Check the live redirects
        if: inputs.task == 'check'
        run: |
          git fetch -q --depth=1 origin redirect-data:refs/remotes/origin/redirect-data || true
          git show origin/redirect-data:archive/archived.json > archived.json 2>/dev/null || rm -f archived.json
          node tools/redirects.mjs check $( [ -s archived.json ] && echo archived.json )
