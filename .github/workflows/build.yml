# Builds the site (Astro; see astro.config.mjs) and uploads it, with the data the worker is deployed with, as
# the "build" artifact: site/, worker/knowledge.json and worker/agent-data.json.
# Called by the CI and link-check workflows.
name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/setup-node@0c41b52a17c2687d2fe3c3b95f838b653a4e4e1b # v1
      - uses: Craga89/standards/setup-playwright@0c41b52a17c2687d2fe3c3b95f838b653a4e4e1b # v1
      - name: Fetch the open-source counts (oss branch)
        run: git fetch -q --depth=1 origin oss:refs/remotes/origin/oss || echo "::notice::No oss branch yet; the build uses its fallback counts."
      - name: Build
        run: pnpm run build
        env:
          # Search engines may index the live site (robots.txt and the robots meta tag). Branch previews
          # stay out either way (preview.yml).
          ALLOW_INDEXING: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            site
            worker/knowledge.json
            worker/agent-data.json
          include-hidden-files: true # site/.well-known/
          if-no-files-found: error
          retention-days: 7
