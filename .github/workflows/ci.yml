# Every change: quality checks, a build, then the tests on that build. On main, when everything
# passes, the build is deployed to GitHub Pages and the ask.sh worker to Cloudflare.
#
#   lint ────────────┐
#   build ─┬─ unit ──┼─ deploy (store the live site) ─ pages (GitHub Pages)
#          ├─ e2e ───┤   └─ worker (Cloudflare), smoke tests
#          ├─ a11y ──┘
#          └─ visual (screenshots; reported, doesn't block)
#
# Branches also get a preview at /preview/<branch>-<hash>/, built without waiting for any of this
# (preview.yml, then preview-deploy.yml). The actions and the Pages workflows come from
# Craga89/standards; the job names are the ruleset's required checks, so keep them.
#
# Daily, it runs again so live.json picks up the latest results from the report branches.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Accept the current look as the new screenshot baselines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deploys happen from main only, never from pull requests.
  DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - run: pnpm run lint
      - run: pnpm run format:check

  build:
    uses: ./.github/workflows/build.yml

  unit:
    name: Types and unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      # The worker and its tests read the passages the build wrote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: pnpm run typecheck
      - run: pnpm run test:unit

  e2e:
    name: End-to-end (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: Craga89/standards/github/actions/setup-playwright@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14

  a11y:
    name: WCAG 2.2 AA (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: Craga89/standards/github/actions/setup-playwright@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: pnpm exec playwright test --project=a11y-desktop --project=a11y-mobile --shard=${{ matrix.shard }}/4 --reporter=blob
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  a11y-report:
    name: WCAG 2.2 AA report
    needs: a11y
    if: always() && needs.a11y.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: a11y-blob-*
          path: blob-report
          merge-multiple: true
      - name: Merge the shards
        run: pnpm exec playwright merge-reports --reporter=github,html,./tests/reporters/a11y-report.mjs blob-report
      - name: Summary
        run: |
          node -e '
            const r = require("./a11y.json");
            const lines = [`## WCAG 2.2 AA: ${r.pass ? "pass" : "FAIL"}`, "", `${r.tests} tests, ${r.axeRuns} axe runs (axe ${r.axe})`, ""];
            for (const v of r.violations) lines.push(`- **${v.rule}** (${v.impact}): ${v.help}. \`${v.target}\`, in ${v.states.slice(0, 3).join("; ")}`);
            for (const f of r.failures) lines.push(`- **${f.check}** (${f.state}): ${f.what}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: |
            a11y.json
            playwright-report
          retention-days: 14
      - name: Save to the accessibility branch
        if: env.DEPLOY == 'true'
        run: |
          mkdir -p out/reports && cp a11y.json out/reports/latest.json
      - if: env.DEPLOY == 'true'
        uses: Craga89/standards/github/actions/report-meta@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          dir: out/reports
      - if: env.DEPLOY == 'true'
        uses: Craga89/standards/github/actions/publish-branch@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          branch: accessibility
          source: out
          message: WCAG 2.2 AA report for ${{ github.sha }}

  visual:
    name: Screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: Craga89/standards/github/actions/setup-playwright@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Fetch the baselines
        id: base
        run: |
          if git fetch -q --depth=1 origin visual-baselines; then
            mkdir -p tests/visual/__screenshots__
            git archive FETCH_HEAD | tar -x -C tests/visual/__screenshots__
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      # New baselines: the first run, a dispatch asking for them, or a commit on main with [visual] in its message.
      - name: Decide
        id: mode
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          ASKED: ${{ inputs.update-screenshots }}
        run: |
          if [ "$DEPLOY" = true ] && { [ "${{ steps.base.outputs.have }}" != true ] || [ "$ASKED" = true ] || grep -q '\[visual\]' <<< "$MESSAGE"; }; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare
        if: steps.base.outputs.have == 'true' && steps.mode.outputs.update != 'true'
        run: pnpm exec playwright test --project=visual
      - name: Accept the current look
        if: steps.mode.outputs.update == 'true'
        run: |
          pnpm exec playwright test --project=visual --update-snapshots=all
          { echo "## Screenshot baselines updated"; echo; ls tests/visual/__screenshots__ | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.mode.outputs.update == 'true'
        uses: Craga89/standards/github/actions/publish-branch@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          branch: visual-baselines
          source: tests/visual/__screenshots__
          message: Screenshot baselines for ${{ github.sha }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: playwright-report
          retention-days: 14

  # Stores the live site at the root of the pages branch (the branch previews under preview/ are
  # kept), and `pages` then deploys the branch. This job keeps the name of the ruleset's required
  # "Deploy to GitHub Pages" check.
  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, unit, e2e, a11y]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the pages branch, which also holds the branch previews
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Publish the latest CI results (live.json)
        run: |
          for b in lighthouse accessibility evals oss; do git fetch -q --depth=1 origin "$b:refs/remotes/origin/$b" || true; done
          node tools/live.mjs site/live.json
      # Stamps the commit into the pages (__BUILD_SHA__, __BUILD_SHORT__, __BUILD_AT__) as it stores.
      - uses: Craga89/standards/github/actions/pages-store@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          source: site

  pages:
    needs: deploy
    uses: Craga89/standards/.github/workflows/pages-deploy.yml@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write # marks the branch previews it publishes live on their commits

  # Bing, Yandex, Seznam, Naver and Yep recrawl the pages that changed (tools/lib/indexnow.mjs). It
  # compares the live site just published (the root of the pages branch, previews left out) with the
  # indexnow branch: the site as IndexNow was last told about it. That branch moves on only once
  # IndexNow accepts, so a failed run's pages are sent again next time, and a failure here doesn't
  # fail the deploy.
  indexnow:
    name: Tell search engines what changed (IndexNow)
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the indexnow branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: The live site, before and after
        run: |
          mkdir -p "$RUNNER_TEMP/before" "$RUNNER_TEMP/live"
          if git fetch -q --depth=1 origin indexnow; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/before"
          # Until the indexnow branch exists: the last snapshot from site-store's deployed/.
          elif git fetch -q --depth=1 origin site-store; then
            git archive FETCH_HEAD deployed | tar -x -C "$RUNNER_TEMP/before" --strip-components=1 || true
          fi
          git fetch -q --depth=1 origin pages
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/live"
          rm -rf "$RUNNER_TEMP/live/preview"
      - name: Tell search engines what changed (IndexNow)
        id: indexnow
        continue-on-error: true
        run: node tools/indexnow.mjs "$RUNNER_TEMP/before" "$RUNNER_TEMP/live" https://craigthompson.dev
      - name: Remember what IndexNow was told (indexnow branch)
        if: steps.indexnow.outcome == 'success'
        uses: Craga89/standards/github/actions/publish-branch@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          branch: indexnow
          source: ${{ runner.temp }}/live
          message: IndexNow snapshot for ${{ github.sha }}

  worker:
    name: Deploy the ask.sh worker
    needs: [lint, unit]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ask-worker
      cancel-in-progress: false
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      WORKER_URL: https://craga-ask.craga89.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the ask.sh worker."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      # Before the deploy: wrangler is a dev dependency, which wrangler-action then uses as it is.
      # (Left to itself, it would npm install wrangler into the root package.json.)
      - if: env.HAS_TOKEN == 'true'
        uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          packageManager: pnpm
          wranglerVersion: '4'
      # Real questions spend the day's AI test allowance, so only when the worker's code changed.
      - name: Decide whether to ask real questions
        if: env.HAS_TOKEN == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || git diff --name-only HEAD~1 HEAD | grep -qE '^(worker/src/|shared/)'; then
            echo "SMOKE_AI=1" >> "$GITHUB_ENV"
          fi
      - name: Smoke test
        if: env.HAS_TOKEN == 'true'
        run: sleep 5 && pnpm run test:smoke
