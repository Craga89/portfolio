# Every change: quality checks, a build, then the tests on that build. On main, when everything
# passes, the build is deployed to GitHub Pages and the ask.sh worker to Cloudflare.
#
#   lint ────────────┐
#   build ─┬─ unit ──┼─ deploy (Pages)
#          ├─ e2e ───┤   └─ worker (Cloudflare), smoke tests
#          ├─ a11y ──┘
#          └─ visual (screenshots; reported, doesn't block)
#
# Daily, it runs again so live.json picks up the latest results from the report branches.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Accept the current look as the new screenshot baselines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deploys happen from main only, never from pull requests.
  DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run lint
      - run: npm run format:check

  build:
    uses: ./.github/workflows/build.yml

  unit:
    name: Types and unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      # The worker and its tests read the passages the build wrote.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: npm run typecheck
      - run: npm run test:unit

  e2e:
    name: End-to-end (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: npx playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14

  a11y:
    name: WCAG 2.2 AA (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: npx playwright test --project=a11y-desktop --project=a11y-mobile --shard=${{ matrix.shard }}/4 --reporter=blob
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  a11y-report:
    name: WCAG 2.2 AA report
    needs: a11y
    if: always() && needs.a11y.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: a11y-blob-*
          path: blob-report
          merge-multiple: true
      - name: Merge the shards
        run: npx playwright merge-reports --reporter=github,html,./tests/reporters/a11y-report.mjs blob-report
      - name: Summary
        run: |
          node -e '
            const r = require("./a11y.json");
            const lines = [`## WCAG 2.2 AA: ${r.pass ? "pass" : "FAIL"}`, "", `${r.tests} tests, ${r.axeRuns} axe runs (axe ${r.axe})`, ""];
            for (const v of r.violations) lines.push(`- **${v.rule}** (${v.impact}): ${v.help}. \`${v.target}\`, in ${v.states.slice(0, 3).join("; ")}`);
            for (const f of r.failures) lines.push(`- **${f.check}** (${f.state}): ${f.what}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: |
            a11y.json
            playwright-report
          retention-days: 14
      - name: Save to the accessibility branch
        if: env.DEPLOY == 'true'
        run: |
          mkdir -p out/reports && cp a11y.json out/reports/latest.json
          echo "$GITHUB_SHA" > out/reports/commit.txt
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > out/reports/run.txt
          date -u +%FT%TZ > out/reports/at.txt
      - if: env.DEPLOY == 'true'
        uses: ./.github/actions/publish-branch
        with:
          branch: accessibility
          source: out
          message: WCAG 2.2 AA report for ${{ github.sha }}

  visual:
    name: Screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Fetch the baselines
        id: base
        run: |
          if git fetch -q --depth=1 origin visual-baselines; then
            mkdir -p tests/visual/__screenshots__
            git archive FETCH_HEAD | tar -x -C tests/visual/__screenshots__
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      # New baselines: the first run, a dispatch asking for them, or a commit on main with [visual] in its message.
      - name: Decide
        id: mode
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          ASKED: ${{ inputs.update-screenshots }}
        run: |
          if [ "$DEPLOY" = true ] && { [ "${{ steps.base.outputs.have }}" != true ] || [ "$ASKED" = true ] || grep -q '\[visual\]' <<< "$MESSAGE"; }; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare
        if: steps.base.outputs.have == 'true' && steps.mode.outputs.update != 'true'
        run: npx playwright test --project=visual
      - name: Accept the current look
        if: steps.mode.outputs.update == 'true'
        run: |
          npx playwright test --project=visual --update-snapshots=all
          { echo "## Screenshot baselines updated"; echo; ls tests/visual/__screenshots__ | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.mode.outputs.update == 'true'
        uses: ./.github/actions/publish-branch
        with:
          branch: visual-baselines
          source: tests/visual/__screenshots__
          message: Screenshot baselines for ${{ github.sha }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: playwright-report
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, unit, e2e, a11y]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish the latest CI results (live.json)
        run: |
          for b in lighthouse accessibility evals oss; do git fetch -q --depth=1 origin "$b:refs/remotes/origin/$b" || true; done
          node tools/live.mjs site/live.json
      - name: Stamp the commit into the page
        run: sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g; s/__BUILD_SHORT__/${GITHUB_SHA::7}/g; s/__BUILD_AT__/$(git log -1 --format=%cI)/g" site/index.html
      # v3: v4 leaves out dotfiles, and the site has .well-known/.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  worker:
    name: Deploy the ask.sh worker
    needs: [lint, unit]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ask-worker
      cancel-in-progress: false
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      WORKER_URL: https://craga-ask.craga89.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the ask.sh worker."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
      # Real questions spend the day's AI test allowance, so only when the worker's code changed.
      - name: Decide whether to ask real questions
        if: env.HAS_TOKEN == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || git diff --name-only HEAD~1 HEAD | grep -qE '^(worker/src/|shared/)'; then
            echo "SMOKE_AI=1" >> "$GITHUB_ENV"
          fi
      - if: env.HAS_TOKEN == 'true'
        uses: ./.github/actions/setup-node
      - name: Smoke test
        if: env.HAS_TOKEN == 'true'
        run: sleep 5 && npm run test:smoke
