# One-off (re-run to update): vendors axe-core into tools/vendor/ so the accessibility
# checks run the same engine locally and in CI without installing anything.
name: Vendor axe-core

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download
        run: |
          mkdir -p tools/vendor && cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i axe-core@4 >/dev/null
          cp node_modules/axe-core/axe.min.js node_modules/axe-core/LICENSE "$GITHUB_WORKSPACE/tools/vendor/"
          node -p "require('./node_modules/axe-core/package.json').version" > "$GITHUB_WORKSPACE/tools/vendor/axe.version"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/vendor
          git diff --cached --quiet && exit 0
          git commit -m "Vendor axe-core $(cat tools/vendor/axe.version) for the accessibility checks"
          git push
