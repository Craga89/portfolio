# Weekly summary of visits and ask.sh questions, shown on the run's summary page.
# Uses the same Cloudflare secrets as the Worker deploy; the API token needs D1 read access.
name: Weekly stats

on:
  schedule:
    - cron: '7 7 * * 1' # Mondays, 07:07 UTC
  workflow_dispatch:
    inputs:
      days:
        description: How many days to cover
        default: '7'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Report
        run: node tools/stats-report.mjs "${{ inputs.days || '7' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
