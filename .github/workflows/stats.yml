# Weekly summary of visits and ask.sh questions, shown on the run's summary page.
# Uses the same Cloudflare secrets as the Worker deploy; the API token needs D1 read access.
name: Weekly stats

on:
  schedule:
    - cron: '7 7 * * 1' # Mondays, 07:07 UTC
  workflow_dispatch:
    inputs:
      days:
        description: How many days to cover
        default: '7'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Report
        run: node tools/stats-report.mjs "${{ inputs.days || '7' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
