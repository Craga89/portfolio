# Weekly summary of visits and ask.sh questions, shown on the run's summary page.
# Uses the same Cloudflare secrets as the Worker deploy; the API token needs D1 read access.
name: Weekly stats

on:
  schedule:
    - cron: '7 7 * * 1' # Mondays, 07:07 UTC
  workflow_dispatch:
    inputs:
      days:
        description: How many days to cover
        default: '7'

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The report runs wrangler, a dev dependency.
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - name: Report
        run: node tools/stats-report.mjs "$DAYS"
        env:
          DAYS: ${{ inputs.days || '7' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
