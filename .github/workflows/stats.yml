# Weekly summary of visits and ask.sh questions, shown on the run's summary page.
# Uses the same Cloudflare secrets as the Worker deploy; the API token needs D1 read access.
name: Weekly stats

on:
  schedule:
    - cron: '7 7 * * 1' # Mondays, 07:07 UTC
  workflow_dispatch:
    inputs:
      days:
        description: How many days to cover
        default: '7'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: Report
        run: node tools/stats-report.mjs "${{ inputs.days || '7' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
