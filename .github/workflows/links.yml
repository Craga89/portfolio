# Weekly dead-link check across the built site (site/), so moved or deleted projects in the
# open-source list, recommendations and case studies get noticed.
name: Link check

on:
  schedule:
    - cron: '29 6 * * 1' # Mondays, 06:29 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          output: lychee/out.md
          jobSummary: true
          # LinkedIn refuses automated requests (HTTP 999); the site's own domain is checked by the other workflows.
          # __BUILD_SHA__ is the version-stamp placeholder, filled in at deploy.
          args: >-
            --no-progress --max-concurrency 8 --timeout 20 --max-retries 2
            --accept 200,201,204,206,301,302,307,308,403,429
            --exclude 'linkedin\.com' --exclude '^mailto:' --exclude 'craigthompson\.dev'
            --exclude 'workers\.dev' --exclude 'google\.com/maps'
            --exclude '__BUILD_SHA__'
            --root-dir "${{ github.workspace }}/site"
            'site/index.html' 'site/cv/index.html' 'site/llms.txt'
      - name: List broken links
        if: failure()
        run: |
          [ -f lychee/out.md ] || { echo "::error title=Link check::no report written"; exit 0; }
          grep -E '^\s*[*-] \[' lychee/out.md | head -40 | while IFS= read -r l; do echo "::error title=Broken link::$l"; done
          grep -qE '^\s*[*-] \[' lychee/out.md || echo "::error title=Link check::$(head -c 900 lychee/out.md | tr '\n' ' ')"
