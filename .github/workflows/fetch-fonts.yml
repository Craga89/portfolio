# One-off: downloads the site's Google Fonts (woff2, latin + latin-ext) into src/fonts/
# so the site can serve them itself, then commits them to main.
name: Fetch fonts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download
        run: node tools/fetch-fonts.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/fonts
          git diff --cached --quiet && exit 0
          git commit -m "Self-host the site fonts (fetched from Google Fonts)"
          git push
