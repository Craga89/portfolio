# Runs Lighthouse (mobile and desktop) against the live site and saves a summary to the
# `lighthouse` branch (reports/summary.json + full reports), so results can be read back later.
name: Lighthouse audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to audit (blank = the first address that's serving this site)
        default: ''
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '43 5 * * 1' # Mondays, 05:43 UTC

permissions:
  contents: write

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: Install Lighthouse
        run: npm i -g lighthouse@12
      - name: Audit
        run: |
          mkdir -p out
          sleep 20 # let the Pages CDN pick up a fresh deploy
          # Use the first address that serves the site (the new domain, then the old one while DNS moves).
          # A domain only counts if it serves this site (CRAGA_BUILD is in every build), not a redirect elsewhere.
          if [ -z "$URL" ]; then
            for u in https://craigthompson.dev/ https://craga89.github.io/portfolio/; do
              final=$(curl -sfL -m 20 -o page.html -w '%{url_effective}' "$u" || true)
              if grep -q CRAGA_BUILD page.html 2>/dev/null; then URL="$final"; break; fi
              echo "::warning title=Lighthouse::$u isn't serving this site yet (ended up at ${final:-no response})"
            done
          fi
          [ -n "$URL" ] || { echo "::error::No address is serving the site"; exit 1; }
          echo "::notice title=Lighthouse::Auditing $URL"; echo "URL=$URL" >> "$GITHUB_ENV"
          # SEO is only checked once the site is open to search engines.
          if curl -sf -m 20 "${URL%/}/robots.txt" | grep -qx 'Disallow: /'; then echo "INDEXED=0" >> "$GITHUB_ENV"; else echo "INDEXED=1" >> "$GITHUB_ENV"; fi
          for preset in mobile desktop; do
            for i in 1 2 3; do
              flags=""; [ "$preset" = desktop ] && flags="--preset=desktop"
              lighthouse "$URL" $flags --quiet --output=json --output-path="out/$preset-$i.json" \
                --chrome-flags="--headless=new --no-sandbox" 2> "out/$preset-$i.log" \
                || echo "::warning title=Lighthouse $preset run $i::$(tail -c 600 "out/$preset-$i.log" | tr '\n' ' ')"
            done
          done
          if ! node tools/lighthouse-summary.mjs out > out/summary.json 2> out/summary.err; then
            echo "::error title=Lighthouse summary::$(tail -c 800 out/summary.err | tr '\n' ' ')"; exit 1
          fi
          head -c 4000 out/summary.json
      - name: Prepare the report
        run: |
          mkdir -p report/reports && cp out/summary.json report/reports/summary.json
          for f in out/mobile-2.json out/desktop-2.json; do [ -f "$f" ] && cp "$f" report/reports/; done
          echo "${{ github.event.workflow_run.head_sha || github.sha }}" > report/reports/commit.txt
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > report/reports/run.txt
          date -u +%FT%TZ > report/reports/at.txt
      - uses: ./.github/actions/publish-branch
        with:
          branch: lighthouse
          source: report
          message: Lighthouse for ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check thresholds
        # Fails the run if a score drops: performance under 95, or accessibility / best practices
        # under 100. SEO is only checked once the site is open to search engines (no noindex).
        run: |
          node -e '
            const s = require("./out/summary.json");
            const indexed = process.env.INDEXED === "1";
            const min = { performance: 95, accessibility: 100, "best-practices": 100, ...(indexed ? { seo: 100 } : {}) };
            let bad = 0;
            for (const preset of ["mobile", "desktop"]) {
              const sc = (s[preset] || {}).scores || {};
              for (const [k, v] of Object.entries(min)) {
                if (sc[k] == null || sc[k] < v) { bad++; console.log(`::error title=Lighthouse ${preset}::${k} ${sc[k]} (needs ${v})`); }
                else console.log(`${preset} ${k}: ${sc[k]}`);
              }
            }
            process.exit(bad ? 1 : 0);
          '
