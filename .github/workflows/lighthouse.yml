# Runs Lighthouse (mobile and desktop) against the live site and saves a summary to the
# `lighthouse` branch (reports/summary.json + full reports), so results can be read back later.
name: Lighthouse audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to audit
        default: https://craigthompson.dev/
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
  schedule:
    - cron: '43 5 * * 1' # Mondays, 05:43 UTC

permissions:
  contents: write

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Lighthouse
        run: npm i -g lighthouse@12
      - name: Audit
        run: |
          mkdir -p out
          sleep 20 # let the Pages CDN pick up a fresh deploy
          # Use the first address that serves the site (the new domain, then the old one while DNS moves).
          if [ -z "$URL" ]; then
            for u in https://craigthompson.dev/ https://craga.dev/ https://craga89.github.io/portfolio/; do
              if curl -sfL -o /dev/null -m 20 "$u"; then URL="$u"; break; fi
            done
          fi
          [ -n "$URL" ] || { echo "::error::No address is serving the site"; exit 1; }
          echo "Auditing $URL"; echo "URL=$URL" >> "$GITHUB_ENV"
          for preset in mobile desktop; do
            for i in 1 2 3; do
              flags=""; [ "$preset" = desktop ] && flags="--preset=desktop"
              lighthouse "$URL" $flags --quiet --output=json --output-path="out/$preset-$i.json" \
                --chrome-flags="--headless=new --no-sandbox" || true
            done
          done
          node tools/lighthouse-summary.mjs out > out/summary.json
          cat out/summary.json | head -c 4000
      - name: Save to the lighthouse branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha=${{ github.event.workflow_run.head_sha || github.sha }}
          git fetch origin lighthouse || true
          git switch --orphan lh-tmp
          git rm -rq --cached . || true
          mkdir -p reports && cp out/summary.json reports/summary.json
          for f in out/mobile-2.json out/desktop-2.json; do [ -f "$f" ] && cp "$f" reports/; done
          echo "$sha" > reports/commit.txt
          git add reports
          git commit -qm "Lighthouse for $sha"
          git push -f origin lh-tmp:lighthouse
      - name: Check thresholds
        # Fails the run if a score drops: performance under 95, or accessibility / best practices
        # under 100. SEO is only checked once the site is open to search engines (no noindex).
        run: |
          node -e '
            const s = require("./out/summary.json");
            const indexed = !require("fs").readFileSync("site/robots.txt", "utf8").includes("Disallow: /");
            const min = { performance: 95, accessibility: 100, "best-practices": 100, ...(indexed ? { seo: 100 } : {}) };
            let bad = 0;
            for (const preset of ["mobile", "desktop"]) {
              const sc = (s[preset] || {}).scores || {};
              for (const [k, v] of Object.entries(min)) {
                if (sc[k] == null || sc[k] < v) { bad++; console.log(`::error title=Lighthouse ${preset}::${k} ${sc[k]} (needs ${v})`); }
                else console.log(`${preset} ${k}: ${sc[k]}`);
              }
            }
            process.exit(bad ? 1 : 0);
          '
