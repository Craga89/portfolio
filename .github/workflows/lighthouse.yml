# Runs Lighthouse (mobile and desktop) against the live site and saves a summary to the
# `lighthouse` branch (reports/summary.json + full reports), so results can be read back later.
name: Lighthouse audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to audit (blank = the first address that's serving this site)
        default: ''
  # zizmor flags workflow_run because it runs with write access after another run, which is unsafe
  # when it uses that run's code or artifacts. This only follows CI's successful runs on main (never
  # a pull request's), and audits the live site, not the run's build.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '43 5 * * 1' # Mondays, 05:43 UTC

permissions:
  contents: write

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # publish-branch pushes with the checkout's credentials.
          persist-credentials: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Kept out of the site's lockfile; installed on its own here (see .github/zizmor.yml).
      - name: Install Lighthouse
        run: |
          mkdir -p "$RUNNER_TEMP/lighthouse" && cd "$RUNNER_TEMP/lighthouse"
          echo '{"private":true}' > package.json
          pnpm add lighthouse@12 --config.strict-dep-builds=false > /dev/null
      - name: Audit
        id: audit
        run: |
          lighthouse() { "$RUNNER_TEMP/lighthouse/node_modules/.bin/lighthouse" "$@"; }
          mkdir -p out
          # The live site, on Cloudflare. It only counts if it serves this site (the home page carries
          # its build stamp, data-built), not a redirect elsewhere.
          if [ -z "$URL" ]; then
            for u in https://craigthompson.dev/; do
              final=$(curl -sfL -m 20 -o page.html -w '%{url_effective}' "$u" || true)
              if grep -q "data-built=" page.html 2>/dev/null; then URL="$final"; break; fi
              echo "::warning title=Lighthouse::$u isn't serving this site yet (ended up at ${final:-no response})"
            done
          fi
          [ -n "$URL" ] || { echo "::error::No address is serving the site"; exit 1; }
          echo "::notice title=Lighthouse::Auditing $URL"
          # SEO is only checked once the site is open to search engines.
          if curl -sf -m 20 "${URL%/}/robots.txt" | grep -qx 'Disallow: /'; then echo "indexed=0" >> "$GITHUB_OUTPUT"; else echo "indexed=1" >> "$GITHUB_OUTPUT"; fi
          for preset in mobile desktop; do
            for i in 1 2 3; do
              flags=""; [ "$preset" = desktop ] && flags="--preset=desktop"
              lighthouse "$URL" $flags --quiet --output=json --output-path="out/$preset-$i.json" \
                --chrome-flags="--headless=new --no-sandbox" 2> "out/$preset-$i.log" \
                || echo "::warning title=Lighthouse $preset run $i::$(tail -c 600 "out/$preset-$i.log" | tr '\n' ' ')"
            done
          done
          if ! node tools/lighthouse-summary.mjs out > out/summary.json 2> out/summary.err; then
            echo "::error title=Lighthouse summary::$(tail -c 800 out/summary.err | tr '\n' ' ')"; exit 1
          fi
          head -c 4000 out/summary.json
      - name: Prepare the report
        run: |
          mkdir -p report/reports && cp out/summary.json report/reports/summary.json
          for f in out/mobile-2.json out/desktop-2.json; do [ -f "$f" ] && cp "$f" report/reports/; done
      - uses: Craga89/standards/github/actions/report-meta@853466a9240bc03d592fa6a406378379f7c6dc7e # v1.1.0
        with:
          dir: report/reports
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: Craga89/standards/github/actions/publish-branch@853466a9240bc03d592fa6a406378379f7c6dc7e # v1.1.0
        with:
          branch: lighthouse
          source: report
          message: Lighthouse for ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check thresholds
        # Fails the run if a score drops: performance under 95, or accessibility / best practices
        # under 100. SEO is only checked once the site is open to search engines (no noindex).
        env:
          INDEXED: ${{ steps.audit.outputs.indexed }}
        run: |
          node -e '
            const s = require("./out/summary.json");
            const indexed = process.env.INDEXED === "1";
            const min = { performance: 95, accessibility: 100, "best-practices": 100, ...(indexed ? { seo: 100 } : {}) };
            let bad = 0;
            for (const preset of ["mobile", "desktop"]) {
              const sc = (s[preset] || {}).scores || {};
              for (const [k, v] of Object.entries(min)) {
                if (sc[k] == null || sc[k] < v) { bad++; console.log(`::error title=Lighthouse ${preset}::${k} ${sc[k]} (needs ${v})`); }
                else console.log(`${preset} ${k}: ${sc[k]}`);
              }
            }
            process.exit(bad ? 1 : 0);
          '
