# Weekly updates for the dev dependencies (the npm ecosystem, which covers pnpm-lock.yaml) and the
# pinned GitHub Actions (Craga89/standards included), grouped into one
# pull request each so CI checks them together. Each waits a week after a release (cooldown), so a
# compromised release is usually caught and pulled before it reaches us.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns: ['*']
    ignore:
      # astro check doesn't support TypeScript 7 yet ("install TypeScript 6 instead"). Remove when
      # it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The types follow the Node version in .node-version, so they move with it, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
