# Weekly updates for the dev dependencies (the npm ecosystem, which covers pnpm-lock.yaml) and the
# pinned GitHub Actions (Craga89/standards included), grouped into one
# pull request each so CI checks them together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
