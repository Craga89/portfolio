# zizmor's settings (.github/workflows/zizmor.yml). Each ignore says why the finding is accepted.
rules:
  # Installing outside the lockfile:
  # - bootstrap.yml exists to install the latest of everything and write a fresh lockfile.
  # - lighthouse.yml installs Lighthouse on its own, for an audit of the live site, rather than
  #   adding it and its dependencies to the site's lockfile.
  adhoc-packages:
    ignore:
      - bootstrap.yml
      - lighthouse.yml
  # The shared workflows from Craga89/standards are pinned to the commit they were merged in, which
  # is newer than its v1 branch, so the "# v1" comment can't match. Remove this once standards tags
  # its releases (or moves v1) and the comments name a matching version.
  ref-version-mismatch:
    ignore:
      - security.yml
      - cloudflare.yml
