name: Set up Node
description: Node from .node-version with the npm cache, and the project's dependencies (npm ci).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
