name: Set up Node
description: Node from .node-version with the npm cache, and the project's dependencies (npm ci).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: .node-version
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
