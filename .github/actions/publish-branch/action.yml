name: Publish to a report branch
description: >-
  Replace a branch's contents with some files, as one commit with no history (the report
  branches: accessibility, lighthouse, evals, oss, visual-baselines, redirect-data, blog-import).
  The workspace is left as it was.
inputs:
  branch:
    description: The branch to publish to
    required: true
  source:
    description: A directory whose contents become the branch's
    required: true
  message:
    description: The commit message
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        SOURCE: ${{ inputs.source }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        # A commit of $SOURCE made with a separate index, so the checkout is untouched.
        export GIT_INDEX_FILE="$RUNNER_TEMP/publish-index-$RANDOM"
        export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
        export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
        export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
        git --work-tree "$SOURCE" add -A -f .
        commit="$(git commit-tree "$(git write-tree)" -m "$MESSAGE")"
        rm -f "$GIT_INDEX_FILE"
        git push -qf origin "$commit:refs/heads/$BRANCH"
