# From LinkedIn, quoted as written. A blank line in a quote starts a new paragraph.
gareth-lowrie:
  order: 1
  name: Gareth Lowrie
  role: Deputy Head of Engineering at Hive HR
  when: November 2026 · reported to Craig directly
  quote: |-
    I’ve worked closely with Craig at Hive for a long time, and honestly, he’s the main reason I stayed.

    Craig is one of the most technically capable people I’ve worked with. His knowledge of AWS infrastructure is deep, and whenever I want a second opinion on a problem, he’s a great person to talk it through with. He’s also brilliant at getting stuff done quickly without cutting corners on security, which is a rare combination.

    Whether we’re planning and prioritising the roadmap or halfway through a build and hitting problems, he’s a great person to bounce ideas off. He’ll challenge the requirements, spot the gaps early and help land on something that actually works.

    He’s also really generous with what he knows and always happy to share it with me and the wider team.

    On top of all that, he’s just great to work with. Any team would be lucky to have him.
harry-wright:
  order: 2
  name: Harry Wright
  role: Product Manager at Hive HR
  when: November 2026 · worked with Craig on the same team
  quote: |-
    I’ve had the pleasure of working alongside Craig for several years. His ability to lead a team and bring everyone together around a shared vision has been key to engineering’s success at Hive.

    Craig made sure engineering didn’t just work closely with product (something I’m genuinely grateful for). He also helped teams across the business understand how engineering contributes to our wider goals, and how we could all help each other succeed.

    More recently, he was a key voice in Hive’s move to become AI-first, both in how we work and how we build. Honestly, I don’t think we’d have hit our roadmap goals without his passion and determination to create a better product and a better place to work.

    I’d highly recommend Craig as a colleague, a leader and a genuinely great person to work with.
