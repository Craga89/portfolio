lloyd-rodrigues-powell:
  order: 1
  name: Lloyd Rodrigues Powell
  role: Head of Software Development at Northumbria Healthcare NHS Foundation Trust
  when: May 2021 · worked with Craig on the same team
  quote: |-
    I worked with Craig over a number of years whilst we were both in the development team at Communicator. Craig's passion towards getting the best solution in place is unmatched. He cares about both the smaller details and bigger picture. I enjoyed working with Craig on a number of projects, we developed a great rapport and I would happily highlight that Craig went from colleague to friend whilst we worked on a number of fantastic features that were added to the Communicator platform.

    Craig keeps himself ahead of the game, he understands all of the bleeding edge technology, when it would be worthy of considering as a developmental option and when it's still too much in its infancy to risk adopting. I'd recommend him to anyone and believe his front end skillset is of a substantially high quality.

    Even after a number of years separated professionally, I still call Craig a friend and wouldn't think twice about accepting the invitation of a catch up over a cold beverage. I'd also jump at the chance to collaborate again in the future and I really hope our paths will cross again!
