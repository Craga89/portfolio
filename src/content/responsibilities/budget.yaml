title: Every pound accounted for
lede: "I've owned the substantial monthly AWS budget for a SaaS platform across production, staging and several development environments, keeping it cost-effective, with cost anomaly detection across every area so there were no surprise bills. I've managed all the technical suppliers behind the platform, and the wider IT suppliers as IT lead, negotiating renewals and contracts for cost efficiency. I've also chosen and consolidated software tools and licences across the business, and coordinated the company's R&D tax credit claims over several years, building the evidence from our roadmap and time-tracking systems. Those claims secured a substantial amount of tax relief."
points:
  - Unexpected spend surfaced early rather than in the monthly bill.
  - Supplier contracts were renegotiated at renewal for cost efficiency.
  - Fewer overlapping tools and licences to pay for.
  - R&D tax relief claimed, backed by evidence from the roadmap and time tracking.
