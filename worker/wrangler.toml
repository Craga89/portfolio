name = "craga-ask"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Workers AI (free daily allowance; requests fail rather than bill once it's used up).
[ai]
binding = "AI"

# 8 questions a minute per visitor.
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# Visit counts: 30 beacons a minute per visitor at most.
[[ratelimits]]
name = "HIT_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Reading answers aloud: 12 a minute per visitor.
[[ratelimits]]
name = "SPEAK_LIMITER"
namespace_id = "1003"
simple = { limit = 12, period = 60 }

# Anonymous question log and visit counts (schema in schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "craga-ask"
database_id = "50a1bb5b-4518-449e-a2a3-c62990219ca0"

[observability]
enabled = true

# MCP endpoint (/mcp): 60 requests a minute per client. ask tool calls also count against ASK_LIMITER.
[[ratelimits]]
name = "MCP_LIMITER"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[vars]
# Where the MCP tools link to and read live.json from. Switch to https://craigthompson.dev once it serves the site.
SITE_URL = "https://craga.dev"
