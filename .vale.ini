# Vale (https://vale.sh) checks the site's writing against the house style in .vale/styles/House:
# British spelling, no idioms or unsupported claims (errors), and filler words, long sentences and
# exclamation marks (warnings). CI runs it on the content (.github/workflows/vale.yml); errors fail
# the check. Locally: vale src/content
StylesPath = .vale/styles
MinAlertLevel = warning

# MDX needs Vale's MDX support (mdx2vast), which CI installs.
[formats]
mdx = md

# The site's own writing. The blog is the old posts, archived as they were written, so it's left
# out.
[src/content/{career,case-studies,responsibilities,sections}/*.{md,mdx}]
BasedOnStyles = House

[README.md]
BasedOnStyles = House
